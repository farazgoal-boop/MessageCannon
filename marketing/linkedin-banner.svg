<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MessageCannon LinkedIn Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1028"/>
      <stop offset="56%" stop-color="#5E1742"/>
      <stop offset="100%" stop-color="#A61E4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#04070E" flood-opacity="0.36"/>
    </filter>
    <clipPath id="portraitClip">
      <circle cx="1320" cy="196" r="104"/>
    </clipPath>
  </defs>
  <rect width="1584" height="396" fill="url(#bg)"/>
  <circle cx="1468" cy="42" r="156" fill="#FF9F1C" opacity="0.14"/>
  <path d="M0 292 L622 112 L1584 272 L1584 396 L0 396 Z" fill="#04070E" opacity="0.30"/>
  <g filter="url(#shadow)">
    <rect x="56" y="52" width="100" height="100" rx="24" fill="#05070F" opacity="0.88"/>
    <image href="../src/assets/icons/app.png" x="66" y="62" width="80" height="80" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="184" y="94" fill="#FFE7A8" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="2">MESSAGECANNON</text>
  <text x="184" y="126" fill="#D9E4EF" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Premium WhatsApp campaign desktop app</text>
  <text x="56" y="208" fill="#FFFFFF" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="76" font-weight="900">MessageCannon</text>
  <text x="58" y="252" fill="#E9EEF6" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">Campaign software with premium desktop UX, delivery reporting, and stronger founder-led branding.</text>
  <rect x="58" y="278" width="868" height="52" rx="18" fill="url(#accent)"/>
  <text x="492" y="311" fill="#17120A" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="23" font-weight="900" text-anchor="middle">IMPORT CONTACTS  •  SEND SMARTER  •  TRACK RESULTS</text>
  <text x="58" y="362" fill="#FFE6C3" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Built to make outreach products look cleaner, stronger, and easier to trust.</text>
  <circle cx="1320" cy="196" r="128" fill="#04070E" opacity="0.44"/>
  <circle cx="1320" cy="196" r="104" fill="#FF9F1C" opacity="0.16"/>
  <image href="../profile.png" x="1216" y="92" width="208" height="208" preserveAspectRatio="xMidYMid meet" clip-path="url(#portraitClip)"/>
