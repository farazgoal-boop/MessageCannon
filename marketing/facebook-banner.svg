        <text x="84" y="448" fill="#F7E8F1" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="29" font-weight="600">and reporting views that feel ready for real client work.</text>
        <rect x="80" y="468" width="198" height="48" rx="18" fill="#173245" opacity="0.94"/>
<text x="179.0" y="499" fill="#FFFFFF" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Import Contacts</text>
<rect x="304" y="468" width="198" height="48" rx="18" fill="#1C6B4D" opacity="0.94"/>
<text x="403.0" y="499" fill="#FFFFFF" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Launch Flows</text>
<rect x="528" y="468" width="198" height="48" rx="18" fill="#7A5825" opacity="0.94"/>
<text x="627.0" y="499" fill="#FFFFFF" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Track Results</text>
        <text x="84" y="556" fill="#FBE4C0" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Persistent sessions, delivery analytics, and premium desktop control in one workspace.</text>
