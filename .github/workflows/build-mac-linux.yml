name: Build Mac and Linux Desktop Apps

# Triggers: any v* tag push, or manually from Actions tab
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-macos:
  # ────────────────────────────────────────────────────────────────────────────
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app bundle with PyInstaller
        run: pyinstaller messagecannon_unix.spec --noconfirm

      - name: Verify .app bundle exists
        run: |
          if [ ! -d "dist/MessageCannonPro.app" ]; then
            echo "ERROR: dist/MessageCannonPro.app not found after PyInstaller run."
            echo "Contents of dist/:"
            ls -la dist/ || true
            exit 1
          fi
          echo "OK: dist/MessageCannonPro.app exists ($(du -sh dist/MessageCannonPro.app | cut -f1))"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG with drag-to-Applications layout
        run: |
          create-dmg \
            --volname "MessageCannon Pro" \
            --volicon "src/assets/icons/app.png" \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 100 \
            --icon "MessageCannonPro.app" 150 180 \
            --hide-extension "MessageCannonPro.app" \
            --app-drop-link 450 180 \
            --no-internet-enable \
            "MessageCannonPro-mac.dmg" \
            "dist/MessageCannonPro.app" \
          || {
            echo "create-dmg failed (may be missing icon), falling back to hdiutil"
            hdiutil create \
              -volname "MessageCannon Pro" \
              -srcfolder "dist/MessageCannonPro.app" \
              -ov -format UDZO \
              "MessageCannonPro-mac.dmg"
          }

      - name: Verify DMG
        run: |
          if [ ! -f "MessageCannonPro-mac.dmg" ]; then
            echo "ERROR: DMG not produced"
            exit 1
          fi
          echo "OK: DMG size $(du -sh MessageCannonPro-mac.dmg | cut -f1)"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessageCannonPro-mac
          path: MessageCannonPro-mac.dmg
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
  # ────────────────────────────────────────────────────────────────────────────
    runs-on: ubuntu-22.04    # pinned: 24.04 removed libfuse2 needed by appimagetool

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-tk \
            python3-dev \
            tk-dev \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libgl1 \
            libfuse2 \
            dpkg-dev \
            fakeroot

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build onedir bundle with PyInstaller
        run: pyinstaller messagecannon_unix.spec --noconfirm

      - name: Verify onedir bundle exists
        run: |
          if [ ! -f "dist/MessageCannonPro/MessageCannonPro" ]; then
            echo "ERROR: dist/MessageCannonPro/MessageCannonPro not found."
            ls -la dist/ || true
            exit 1
          fi
          chmod +x dist/MessageCannonPro/MessageCannonPro
          echo "OK: binary exists ($(du -sh dist/MessageCannonPro | cut -f1))"

      - name: Get version from tag (or fallback)
        id: version
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$RAW" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ── .deb package ─────────────────────────────────────────────────────────
      - name: Build .deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG="messagecannon-pro_${VERSION}_amd64"
          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/opt/messagecannon-pro"
          mkdir -p "${PKG}/usr/bin"
          mkdir -p "${PKG}/usr/share/applications"
          mkdir -p "${PKG}/usr/share/icons/hicolor/256x256/apps"

          # Copy PyInstaller onedir output to /opt/
          cp -r dist/MessageCannonPro/. "${PKG}/opt/messagecannon-pro/"
          chmod +x "${PKG}/opt/messagecannon-pro/MessageCannonPro"

          # Wrapper script in /usr/bin so it's on PATH
          printf '#!/bin/sh\nexec /opt/messagecannon-pro/MessageCannonPro "$@"\n' \
            > "${PKG}/usr/bin/messagecannon-pro"
          chmod +x "${PKG}/usr/bin/messagecannon-pro"

          # App icon
          if [ -f "src/assets/icons/app.png" ]; then
            cp "src/assets/icons/app.png" \
              "${PKG}/usr/share/icons/hicolor/256x256/apps/messagecannon-pro.png"
          fi

          # .desktop launcher
          printf '[Desktop Entry]\nName=MessageCannon Pro\nComment=Bulk WhatsApp and email campaigns\nExec=messagecannon-pro\nIcon=messagecannon-pro\nTerminal=false\nType=Application\nCategories=Office;Network;\nKeywords=whatsapp;email;bulk;messaging;\n' \
            > "${PKG}/usr/share/applications/messagecannon-pro.desktop"

          # DEBIAN/control
          INSTALLED_KB=$(du -sk "${PKG}/opt" | cut -f1)
          printf 'Package: messagecannon-pro\nVersion: %s\nSection: net\nPriority: optional\nArchitecture: amd64\nInstalled-Size: %s\nMaintainer: Muhammad Faraz <farazgoal@gmail.com>\nDescription: MessageCannon Pro\n Bulk WhatsApp and email campaign tool with contact management,\n templating, and live delivery tracking.\nHomepage: https://muhammad-faraz-dev.netlify.app\n' \
            "$VERSION" "$INSTALLED_KB" > "${PKG}/DEBIAN/control"

          # postinst: refresh icon/desktop caches
          printf '#!/bin/sh\nset -e\nupdate-desktop-database -q /usr/share/applications 2>/dev/null || true\ngtk-update-icon-cache -q -t /usr/share/icons/hicolor 2>/dev/null || true\n' \
            > "${PKG}/DEBIAN/postinst"
          chmod 755 "${PKG}/DEBIAN/postinst"

          fakeroot dpkg-deb --build "${PKG}" "MessageCannonPro-linux-${VERSION}.deb"
          echo "OK: $(du -sh MessageCannonPro-linux-${VERSION}.deb | cut -f1)"

      # ── AppImage ──────────────────────────────────────────────────────────────
      - name: Download appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: x86_64
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Binary and all PyInstaller onedir files
          cp -r dist/MessageCannonPro/. AppDir/usr/bin/
          chmod +x AppDir/usr/bin/MessageCannonPro

          # Icon at AppDir root (required by AppImage spec)
          if [ -f "src/assets/icons/app.png" ]; then
            cp src/assets/icons/app.png AppDir/messagecannon-pro.png
            cp src/assets/icons/app.png \
              AppDir/usr/share/icons/hicolor/256x256/apps/messagecannon-pro.png
          fi

          # .desktop at AppDir root (required by AppImage spec)
          printf '[Desktop Entry]\nName=MessageCannon Pro\nComment=Bulk WhatsApp and email campaigns\nExec=MessageCannonPro\nIcon=messagecannon-pro\nTerminal=false\nType=Application\nCategories=Office;Network;\n' \
            > AppDir/messagecannon-pro.desktop
          cp AppDir/messagecannon-pro.desktop \
            AppDir/usr/share/applications/messagecannon-pro.desktop

          # AppRun launcher script
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/MessageCannonPro" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Build AppImage (APPIMAGE_EXTRACT_AND_RUN avoids needing FUSE at build time)
          APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool AppDir \
            "MessageCannonPro-linux-${VERSION}.AppImage"
          echo "OK: $(du -sh MessageCannonPro-linux-${VERSION}.AppImage | cut -f1)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MessageCannonPro-linux
          path: |
            MessageCannonPro-linux-*.deb
            MessageCannonPro-linux-*.AppImage
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
  # ────────────────────────────────────────────────────────────────────────────
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller messagecannon_windows.spec --noconfirm

      - name: Verify EXE exists
        run: |
          if (-not (Test-Path "dist\MessageCannon.exe")) {
            Write-Host "ERROR: dist\MessageCannon.exe not found after PyInstaller run."
            Get-ChildItem dist -ErrorAction SilentlyContinue
            exit 1
          }
          $size = (Get-Item "dist\MessageCannon.exe").Length / 1MB
          Write-Host ("OK: dist\MessageCannon.exe exists ({0:N1} MB)" -f $size)

      - name: Get version from tag (or fallback)
        id: version
        run: |
          $raw = $env:GITHUB_REF_NAME
          if ($raw -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "1.0.0"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        env:
          MY_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:MY_APP_VERSION" `
            "installer\setup.iss"

      - name: Verify installer exists
        run: |
          if (-not (Test-Path "installer\MessageCannon_Setup.exe")) {
            Write-Host "ERROR: installer\MessageCannon_Setup.exe not found after ISCC run."
            exit 1
          }
          $size = (Get-Item "installer\MessageCannon_Setup.exe").Length / 1MB
          Write-Host ("OK: installer size ({0:N1} MB)" -f $size)

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessageCannonPro-windows
          path: installer\MessageCannon_Setup.exe
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  create-release:
  # ────────────────────────────────────────────────────────────────────────────
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    # Only runs on real tag pushes, not workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: "MessageCannon Pro ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/MessageCannonPro-mac/MessageCannonPro-mac.dmg
            artifacts/MessageCannonPro-linux/MessageCannonPro-linux-*.deb
            artifacts/MessageCannonPro-linux/MessageCannonPro-linux-*.AppImage
            artifacts/MessageCannonPro-windows/MessageCannon_Setup.exe
          body: |
            ## Installation

            **Windows:** Download `MessageCannon_Setup.exe` below and run it — no admin rights needed
            (per-user install). Launch MessageCannon from the Start Menu when it's done.

            **macOS:** Download `MessageCannonPro-mac.dmg`, open it, drag the app to Applications.
            > First launch: right-click → Open (Gatekeeper will block double-click since the app is not notarized).

            **Linux (Ubuntu/Debian):**
            ```bash
            sudo dpkg -i MessageCannonPro-linux-*.deb
            messagecannon-pro
            ```

            **Linux (any distro — AppImage):**
            ```bash
            chmod +x MessageCannonPro-linux-*.AppImage
            ./MessageCannonPro-linux-*.AppImage
            ```

            ## Notes
            - WhatsApp sending requires Google Chrome installed on your machine.
            - Gmail SMTP requires an [App Password](https://myaccount.google.com/apppasswords), not your regular password.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
